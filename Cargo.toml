[workspace]
resolver = "2"
members = [
    "crates/benchlab-core",
    "crates/benchlab-store",
    "crates/benchlab-engine",
    "crates/benchlab-analysis",
    "crates/benchlab-ui",
    "crates/benchlab-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-rusqlite = { version = "0.8.0", features = ["bundled"] }
dirs = "6"
fs2 = "0.4.3"
keyring = "4.2.0"
secrecy = "0.10"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
pollster = "0.4"
gpui = "=0.2.2"
unicode-segmentation = "1"
regex = "1"
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
